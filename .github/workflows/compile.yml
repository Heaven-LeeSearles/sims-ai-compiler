name: Compile Sims 4 Python Script

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-24.04

    container:
      image: python:3.7.17-bullseye

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Python version
        run: python --version

      - name: Compile test script
        run: |
          mkdir -p output
          python -m py_compile main.py
          cp __pycache__/main.cpython-37.pyc output/main.pyc

      - name: Upload compiled script
        uses: actions/upload-artifact@v4
        with:
          name: sims-ai-test
          path: output/main.pyc
