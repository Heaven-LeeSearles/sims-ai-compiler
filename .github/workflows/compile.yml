
name: Compile Sims 4 Python Script

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-24.04

    container:
      image: python:3.7.17-bullseye

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Python version
        run: python --version

      - name: Compile all mod modules
        run: |
          mkdir -p output
          python -m py_compile main.py sim_profiles.py

          cp __pycache__/main.cpython-37.pyc output/main.pyc
          cp __pycache__/sim_profiles.cpython-37.pyc output/sim_profiles.pyc

      - name: Package Sims 4 mod
        run: |
          cd output
          zip SimsAI_Test.ts4script main.pyc sim_profiles.pyc

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: SimsAI_Test
          path: output/SimsAI_Test.ts4script

